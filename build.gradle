buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.0.0'
group = 'com.sakhcheese'
archivesBaseName = 'SakhCheeseClient'

sourceCompatibility = targetCompatibility = '1.8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            jvmArgs '-Xms256m', '-Xmx2G'
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2854'
    implementation 'org.jetbrains:annotations:20.1.0'
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'SakhCheeseClient',
            'Specification-Vendor': 'SakhCheeseClient contributors',
            'Specification-Version': version,
            'Implementation-Title': 'SakhCheeseClient',
            'Implementation-Version': version,
            'Implementation-Vendor': 'SakhCheeseClient contributors'
        )
    }
}
jar.finalizedBy('reobfJar')

task schedulerChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.sakhcheese.modules.spammer.PropsUtilChecks'
    maxHeapSize = '64m'
}

task parkourChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.sakhcheese.modules.parkour.JumpPlannerChecks'
    maxHeapSize = '64m'
}

task menuLayoutChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.sakhcheese.gui.MenuLayoutChecks'
    maxHeapSize = '64m'
}

task calculatorChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.sakhcheese.util.CalkChecks'
    maxHeapSize = '64m'
}

task routeChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.sakhcheese.modules.parkour.ParkourRouteChecks'
    maxHeapSize = '64m'
}

check.dependsOn schedulerChecks, parkourChecks, menuLayoutChecks, calculatorChecks, routeChecks
